services:
  db:
    # Assignment requires MySQL 8.0.39
    image: mysql:8.0.39
    container_name: tdt4225-mysql
    restart: unless-stopped
    # skip-log-bin: binlog would roughly double disk usage during bulk insert
    # local-infile: allows fast LOAD DATA LOCAL INFILE from Python
    command:
      - --skip-log-bin
      - --local-infile=1
      - --innodb-buffer-pool-size=2G
      - --innodb-redo-log-capacity=1G
    # Credentials come from .env (copy .env.example)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
